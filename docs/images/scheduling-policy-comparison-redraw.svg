<svg xmlns="http://www.w3.org/2000/svg" width="820" height="648" viewBox="0 0 820 648" font-family="Segoe UI, PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<desc>两种调度策略时间轴对比。左：CFS，每个 worker 计算→spin→futex，futex 后上下文切换（红虚线），末尾 A3 到达同步点（黄虚线）。右：scx-llm-pin，A0–A3 各占一个 CPU，同步点（黄虚线）从 A0 贯穿到 A3。</desc>
<defs>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#1f2328" flood-opacity="0.18"/></filter>
</defs>
<style>
  .t-title{font-size:21px;font-weight:700;fill:#1f2328}
  .t-sub{font-size:13.5px;fill:#57606a}
  .p-title{font-size:14.5px;font-weight:700}
  .cap{font-size:12.5px;fill:#57606a}
  .hd{font-size:12px;fill:#57606a}
  .lbl{font-weight:700}
  .leg-t{font-size:13px;font-weight:700;fill:#1f2328}
  .leg-l{font-size:12.5px;fill:#24292f}
</style>
<rect x="0" y="0" width="820" height="648" fill="#ffffff"/>
<text x="410" y="46" text-anchor="middle" class="t-title">两种调度策略时间轴对比</text>
<text x="410" y="74" text-anchor="middle" class="t-sub">纵轴为时间（向下）；每栏 CPU0–3；worker 顺序：计算 → spin → futex</text>
