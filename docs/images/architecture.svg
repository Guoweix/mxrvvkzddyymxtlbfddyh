<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 920" width="1536" height="920" font-family="'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fb3"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e6a23c"/>
    </marker>
    <style>
      .t  { fill:#1a2b3c; }
      .h  { font-weight:700; }
      .sm { font-size:14px; fill:#3a4a5a; }
      .box-user   { fill:#eef4fb; stroke:#4a90d9; stroke-width:1.5; }
      .box-kern   { fill:#eef7ee; stroke:#4caf50; stroke-width:1.5; }
      .box-orange { fill:#fff3e0; stroke:#e6a23c; stroke-width:1.5; }
      .box-gray   { fill:#f6f7f9; stroke:#c9ced6; stroke-width:1.5; }
      .chip-blue  { fill:#2f6fb3; }
      .chip-green { fill:#2e8b3d; }
      .arw  { stroke:#2f6fb3; stroke-width:2; fill:none; }
      .arwg { stroke:#2e7d32; stroke-width:2; fill:none; }
      .arwo { stroke:#e6a23c; stroke-width:2; fill:none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1536" height="920" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="768" y="46" text-anchor="middle" font-size="36" class="h t">INFERSCHED：面向 RISC-V 的 LLM 推理调度架构</text>
  <text x="768" y="82" text-anchor="middle" font-size="17" class="t">基于 sched_ext (eBPF)：每核唯一定位 RVV vector worker + 自动 phase-aware。</text>

  <!-- ================= 用户态 ================= -->
  <rect x="20" y="105" width="1496" height="265" rx="6" class="box-user"/>
  <rect x="40" y="118" width="100" height="32" rx="5" class="chip-blue"/>
  <text x="90" y="140" text-anchor="middle" font-size="17" class="h" fill="#ffffff">用户态</text>

  <text x="250" y="138" font-size="16" class="t">其他共置实例（最多 8 个）</text>

  <!-- 堆叠的 llama-server：后层只露出顶部标签条 -->
  <rect x="175" y="150" width="340" height="150" rx="6" class="box-user"/>
  <text x="193" y="172" font-size="14" fill="#6b7c8f">llama-server C</text>

  <rect x="145" y="180" width="340" height="150" rx="6" class="box-user"/>
  <text x="163" y="202" font-size="14" fill="#6b7c8f">llama-server B</text>

  <rect x="115" y="210" width="340" height="150" rx="6" fill="#ffffff" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="135" y="246" font-size="22" class="h t">patched llama-server</text>
  <text x="135" y="278" font-size="15" class="sm">OpenMP worker + continuous batching</text>
  <text x="135" y="302" font-size="15" class="sm">注册 worker（TID / tgid / ith）</text>
  <text x="135" y="326" font-size="15" class="sm">发布 phase：PREFILL / DECODE / MIXED</text>

  <!-- dt_controller -->
  <rect x="790" y="170" width="345" height="175" rx="6" fill="#eef4fb" stroke="#2f6fb3" stroke-width="2"/>
  <text x="812" y="204" font-size="20" class="h t">scx_llm_pin（用户态 loader）</text>
  <text x="812" y="238" font-size="15" class="sm">libbpf 加载 + attach struct_ops</text>
  <text x="812" y="262" font-size="15" class="sm">初始化并 pin config / workers map</text>
  <text x="812" y="286" font-size="14" class="sm">控制目录 /sys/fs/bpf/scx_rvv_dirty_lease</text>

  <!-- 说明框 -->
  <rect x="1155" y="200" width="322" height="118" rx="6" fill="#dbe9f7" stroke="#b8d3ee"/>
  <text x="1176" y="230" font-size="16" class="h t">自动 phase-aware（组间仲裁）</text>
  <text x="1176" y="258" font-size="15" class="sm">读到有效 hint：PREFILL/MIXED 优先；</text>
  <text x="1176" y="282" font-size="15" class="sm">否则回退默认轮转。</text>

  <!-- 箭头：llama-server <-> controller -->
  <line x1="490" y1="216" x2="786" y2="216" class="arw" marker-end="url(#ab)"/>
  <text x="638" y="208" text-anchor="middle" font-size="15" fill="#2f6fb3">worker / phase hint</text>
  <line x1="786" y1="262" x2="490" y2="262" class="arwg" marker-end="url(#ag)"/>
  <text x="638" y="282" text-anchor="middle" font-size="15" fill="#2e7d32">config：slice / window / 阈值</text>
  <text x="638" y="302" text-anchor="middle" font-size="14" fill="#2e7d32">（team / CPU 顺序）</text>

  <!-- 下行箭头 -->
  <line x1="290" y1="360" x2="290" y2="402" class="arw" marker-end="url(#ab)"/>
  <text x="302" y="394" font-size="15" fill="#2f6fb3">写入 workers map</text>
  <line x1="965" y1="345" x2="965" y2="423" class="arw" marker-end="url(#ab)"/>
  <text x="977" y="392" font-size="15" fill="#2f6fb3">pin config / workers map</text>

  <!-- ================= Linux 内核 ================= -->
  <rect x="20" y="410" width="1496" height="365" rx="6" class="box-kern"/>
  <rect x="40" y="424" width="130" height="32" rx="5" class="chip-green"/>
  <text x="105" y="446" text-anchor="middle" font-size="17" class="h" fill="#ffffff">Linux 内核</text>

  <!-- bpffs maps -->
  <rect x="490" y="425" width="555" height="135" rx="6" class="box-orange"/>
  <text x="767" y="454" text-anchor="middle" font-size="17" class="h t">bpffs 中 pin 的 BPF maps</text>
  <rect x="512" y="470" width="265" height="76" rx="5" fill="#ffffff" stroke="#e6a23c"/>
  <text x="644" y="498" text-anchor="middle" font-size="16" class="h t">workers map</text>
  <text x="644" y="520" text-anchor="middle" font-size="13" class="sm">worker slot + team phase</text>
  <rect x="789" y="470" width="234" height="76" rx="5" fill="#ffffff" stroke="#e6a23c"/>
  <text x="906" y="498" text-anchor="middle" font-size="16" class="h t">config map</text>
  <text x="906" y="520" text-anchor="middle" font-size="13" class="sm">team / slice / window / dirty</text>

  <!-- map lookup 箭头（maps -> DSQ） -->
  <line x1="700" y1="560" x2="700" y2="583" class="arwo" marker-end="url(#ao)"/>
  <text x="712" y="578" font-size="15" fill="#b5811f">BPF 读取 maps</text>

  <!-- sched_ext eBPF 调度器（左） -->
  <rect x="135" y="585" width="345" height="175" rx="6" fill="#eef7ee" stroke="#2e8b3d" stroke-width="2"/>
  <text x="157" y="618" font-size="20" class="h t">sched_ext eBPF 调度器</text>
  <text x="157" y="650" font-size="15" class="sm">识别 vector：sstatus.VS=Dirty</text>
  <text x="157" y="674" font-size="15" class="sm">每核唯一定位 + per-team/per-CPU VDSQ</text>
  <text x="157" y="698" font-size="15" class="sm">phase-aware 消费 + local 窗口 + kick</text>

  <!-- 驱动放置 箭头 -->
  <line x1="482" y1="672" x2="616" y2="672" class="arwg" marker-end="url(#ag)"/>
  <text x="549" y="664" text-anchor="middle" font-size="15" fill="#2e7d32">驱动放置</text>

  <!-- DSQ 调度队列（中） -->
  <rect x="620" y="585" width="305" height="175" rx="6" fill="#eef7ee" stroke="#2e8b3d" stroke-width="2"/>
  <text x="772" y="616" text-anchor="middle" font-size="19" class="h t">DSQ 调度队列</text>
  <rect x="642" y="632" width="261" height="50" rx="5" fill="#ffffff" stroke="#9fd3a6"/>
  <text x="772" y="656" text-anchor="middle" font-size="15" class="h t">per-team/per-CPU VDSQ</text>
  <text x="772" y="674" text-anchor="middle" font-size="12" class="sm">（vector worker）</text>
  <rect x="642" y="692" width="261" height="50" rx="5" fill="#ffffff" stroke="#9fd3a6"/>
  <text x="772" y="716" text-anchor="middle" font-size="15" class="h t">local / global DSQ</text>
  <text x="772" y="734" text-anchor="middle" font-size="12" class="sm">（非 vector LLM / 普通任务）</text>

  <!-- DSQ -> 调度核心 箭头 -->
  <line x1="927" y1="672" x2="1051" y2="672" class="arwg" marker-end="url(#ag)"/>

  <!-- 调度核心（右） -->
  <rect x="1055" y="585" width="350" height="175" rx="6" fill="#eef7ee" stroke="#2e8b3d" stroke-width="2"/>
  <text x="1077" y="620" font-size="19" class="h t">Linux sched_ext 调度核心</text>
  <text x="1077" y="654" font-size="15" class="sm">调用 struct_ops 回调</text>
  <text x="1077" y="678" font-size="13" class="sm">select_cpu / enqueue / dispatch</text>
  <text x="1077" y="702" font-size="13" class="sm">running / stopping / init / exit</text>
  <text x="1077" y="726" font-size="15" class="sm">维护 DSQ / rq 与 CPU 调度</text>

  <!-- ================= 硬件平台 ================= -->
  <rect x="20" y="790" width="1496" height="92" rx="6" class="box-gray"/>
  <text x="46" y="828" font-size="22" class="h t">RISC-V / K1 硬件平台</text>
  <text x="46" y="858" font-size="16" class="sm">SpacemiT K1（8 核 RISC-V / RVV 1.0）</text>
  <g font-size="15" fill="#1a2b3c">
    <rect x="420" y="815" width="98" height="46" rx="5" fill="#eef1f5" stroke="#c9ced6"/><text x="469" y="844" text-anchor="middle">CPU0</text>
    <rect x="530" y="815" width="98" height="46" rx="5" fill="#eef1f5" stroke="#c9ced6"/><text x="579" y="844" text-anchor="middle">CPU1</text>
    <rect x="640" y="815" width="98" height="46" rx="5" fill="#eef1f5" stroke="#c9ced6"/><text x="689" y="844" text-anchor="middle">CPU2</text>
    <rect x="750" y="815" width="98" height="46" rx="5" fill="#eef1f5" stroke="#c9ced6"/><text x="799" y="844" text-anchor="middle">CPU3</text>
    <rect x="860" y="815" width="98" height="46" rx="5" fill="#eef1f5" stroke="#c9ced6"/><text x="909" y="844" text-anchor="middle">CPU4</text>
    <rect x="970" y="815" width="98" height="46" rx="5" fill="#eef1f5" stroke="#c9ced6"/><text x="1019" y="844" text-anchor="middle">CPU5</text>
    <rect x="1080" y="815" width="98" height="46" rx="5" fill="#eef1f5" stroke="#c9ced6"/><text x="1129" y="844" text-anchor="middle">CPU6</text>
    <rect x="1190" y="815" width="98" height="46" rx="5" fill="#eef1f5" stroke="#c9ced6"/><text x="1239" y="844" text-anchor="middle">CPU7</text>
  </g>
</svg>
