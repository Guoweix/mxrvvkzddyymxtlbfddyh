<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">RVV-aware sched_ext communication architecture</title>
  <desc id="desc">Communication between patched llama-server, rvv_lease_ctl, the scx_llm_pin loader, pinned BPF maps, the sched_ext eBPF scheduler and the Linux scheduling core.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2328" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2f6feb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#238636"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b45309"/>
    </marker>
  </defs>

  <style>
    text { font-family: Inter, "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; letter-spacing: 0; }
    .page-title { font-size: 32px; font-weight: 700; fill: #1f2328; }
    .subtitle { font-size: 17px; fill: #57606a; }
    .layer-label { font-size: 16px; font-weight: 700; fill: #ffffff; }
    .node-title { font-size: 21px; font-weight: 700; fill: #1f2328; }
    .node-line { font-size: 15px; fill: #57606a; }
    .map-title { font-size: 17px; font-weight: 700; fill: #1f2328; }
    .map-line { font-size: 13px; fill: #57606a; }
    .edge-label { font-size: 13px; font-weight: 600; fill: #424a53; }
    .edge-note { font-size: 12px; fill: #57606a; }
    .blue-edge { fill: none; stroke: #2f6feb; stroke-width: 2.5; marker-end: url(#arrow-blue); }
    .green-edge { fill: none; stroke: #238636; stroke-width: 2.5; marker-end: url(#arrow-green); }
    .amber-edge { fill: none; stroke: #b45309; stroke-width: 2.5; marker-end: url(#arrow-amber); }
  </style>

  <rect width="1500" height="980" fill="#f6f8fa"/>

  <text x="50" y="52" class="page-title">RVV-aware sched_ext 通信架构</text>
  <text x="50" y="82" class="subtitle">用户态提示、控制面与 Linux 内核调度数据路径</text>

  <rect x="40" y="110" width="1420" height="270" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="58" y="126" width="112" height="30" rx="4" fill="#2f6feb"/>
  <text x="114" y="147" text-anchor="middle" class="layer-label">用户态</text>

  <rect x="40" y="420" width="1420" height="510" rx="8" fill="#eef6f0" stroke="#9fc5aa" stroke-width="1.5"/>
  <rect x="58" y="436" width="132" height="30" rx="4" fill="#238636"/>
  <text x="124" y="457" text-anchor="middle" class="layer-label">Linux 内核</text>

  <!-- User-space nodes -->
  <g filter="url(#shadow)">
    <rect x="70" y="180" width="350" height="150" rx="8" fill="#ffffff" stroke="#2f6feb" stroke-width="2"/>
    <rect x="70" y="180" width="7" height="150" rx="3" fill="#2f6feb"/>
  </g>
  <text x="100" y="218" class="node-title">patched llama-server</text>
  <text x="100" y="250" class="node-line">OpenMP worker 注册</text>
  <text x="100" y="276" class="node-line">发布 TID / TGID / ith</text>
  <text x="100" y="302" class="node-line">发布 PREFILL / DECODE / MIXED phase</text>

  <g filter="url(#shadow)">
    <rect x="575" y="180" width="350" height="150" rx="8" fill="#ffffff" stroke="#2f6feb" stroke-width="2"/>
    <rect x="575" y="180" width="7" height="150" rx="3" fill="#2f6feb"/>
  </g>
  <text x="605" y="218" class="node-title">scx_llm_pin loader</text>
  <text x="605" y="250" class="node-line">加载 CO-RE BPF object</text>
  <text x="605" y="276" class="node-line">初始化并 pin 控制 maps</text>
  <text x="605" y="302" class="node-line">attach sched_ext struct_ops</text>

  <g filter="url(#shadow)">
    <rect x="1080" y="180" width="350" height="150" rx="8" fill="#ffffff" stroke="#2f6feb" stroke-width="2"/>
    <rect x="1080" y="180" width="7" height="150" rx="3" fill="#2f6feb"/>
  </g>
  <text x="1110" y="218" class="node-title">rvv_lease_ctl</text>
  <text x="1110" y="250" class="node-line">status：读取 config / workers</text>
  <text x="1110" y="276" class="node-line">set / reset：更新 config</text>
  <text x="1110" y="302" class="node-line">通过 BPF syscall 访问 pinned maps</text>

  <!-- Pinned maps -->
  <g filter="url(#shadow)">
    <rect x="500" y="475" width="500" height="175" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  </g>
  <text x="750" y="505" text-anchor="middle" class="map-title">bpffs 中 pin 的 BPF maps</text>

  <rect x="525" y="525" width="215" height="100" rx="6" fill="#fff8e6" stroke="#d97706" stroke-width="1.5"/>
  <text x="632" y="553" text-anchor="middle" class="map-title">workers map</text>
  <text x="632" y="578" text-anchor="middle" class="map-line">TID / TGID / ith</text>
  <text x="632" y="600" text-anchor="middle" class="map-line">team phase / epoch</text>

  <rect x="760" y="525" width="215" height="100" rx="6" fill="#fff8e6" stroke="#d97706" stroke-width="1.5"/>
  <text x="867" y="553" text-anchor="middle" class="map-title">config map</text>
  <text x="867" y="578" text-anchor="middle" class="map-line">slice / window / threshold</text>
  <text x="867" y="600" text-anchor="middle" class="map-line">CPU map / control mode</text>

  <!-- Kernel nodes -->
  <g filter="url(#shadow)">
    <rect x="70" y="700" width="350" height="160" rx="8" fill="#ffffff" stroke="#238636" stroke-width="2"/>
    <rect x="70" y="700" width="7" height="160" rx="3" fill="#238636"/>
  </g>
  <text x="100" y="738" class="node-title">task_struct 与 Vector 状态</text>
  <text x="100" y="770" class="node-line">线程状态与 cpus_ptr</text>
  <text x="100" y="796" class="node-line">RISC-V sstatus.VS = Dirty</text>
  <text x="100" y="822" class="node-line">llama-server OpenMP worker tasks</text>

  <g filter="url(#shadow)">
    <rect x="575" y="700" width="350" height="160" rx="8" fill="#ffffff" stroke="#238636" stroke-width="2"/>
    <rect x="575" y="700" width="7" height="160" rx="3" fill="#238636"/>
  </g>
  <text x="605" y="738" class="node-title">sched_ext eBPF 调度器</text>
  <text x="605" y="770" class="node-line">RVV dirty 与用户 hint 识别</text>
  <text x="605" y="796" class="node-line">唯一 CPU 分配</text>
  <text x="605" y="822" class="node-line">phase-aware vector DSQ 策略</text>

  <g filter="url(#shadow)">
    <rect x="1080" y="700" width="350" height="160" rx="8" fill="#ffffff" stroke="#238636" stroke-width="2"/>
    <rect x="1080" y="700" width="7" height="160" rx="3" fill="#238636"/>
  </g>
  <text x="1110" y="738" class="node-title">Linux sched_ext 调度核心</text>
  <text x="1110" y="770" class="node-line">调用 BPF struct_ops callbacks</text>
  <text x="1110" y="796" class="node-line">管理 DSQ / runqueue</text>
  <text x="1110" y="822" class="node-line">CPU 选择、运行与上下文切换</text>

  <!-- User-space communication paths -->
  <path d="M 245 330 C 255 420, 505 430, 620 515" class="blue-edge"/>
  <rect x="285" y="394" width="238" height="48" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="404" y="414" text-anchor="middle" class="edge-label">BPF_OBJ_GET + mmap</text>
  <text x="404" y="432" text-anchor="middle" class="edge-note">写入 worker 身份与 phase</text>

  <path d="M 150 330 L 150 690" class="blue-edge"/>
  <rect x="166" y="555" width="180" height="29" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="256" y="575" text-anchor="middle" class="edge-label">OpenMP worker threads</text>

  <path d="M 750 330 L 750 465" class="blue-edge"/>
  <rect x="766" y="392" width="182" height="48" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="857" y="412" text-anchor="middle" class="edge-label">创建、初始化、pin</text>
  <text x="857" y="430" text-anchor="middle" class="edge-note">config + workers maps</text>

  <path d="M 1255 330 C 1255 420, 1050 430, 900 515" class="blue-edge"/>
  <rect x="1080" y="394" width="260" height="48" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="1210" y="414" text-anchor="middle" class="edge-label">BPF_MAP_LOOKUP / UPDATE</text>
  <text x="1210" y="432" text-anchor="middle" class="edge-note">读取状态，更新在线策略参数</text>

  <path d="M 925 255 L 1025 255 L 1025 675 L 900 675 L 900 690" class="blue-edge"/>
  <rect x="1038" y="610" width="180" height="48" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="1128" y="630" text-anchor="middle" class="edge-label">libbpf load</text>
  <text x="1128" y="648" text-anchor="middle" class="edge-note">struct_ops attach</text>

  <!-- Kernel data and scheduling paths -->
  <path d="M 750 650 L 750 690" class="amber-edge"/>
  <rect x="766" y="657" width="116" height="27" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="824" y="676" text-anchor="middle" class="edge-label">map lookup</text>

  <path d="M 420 780 L 565 780" class="amber-edge"/>
  <rect x="438" y="742" width="112" height="27" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="494" y="761" text-anchor="middle" class="edge-label">BPF CO-RE 读取</text>

  <path d="M 1070 750 L 935 750" class="green-edge"/>
  <rect x="950" y="707" width="110" height="32" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="1005" y="728" text-anchor="middle" class="edge-label">struct_ops 回调</text>

  <path d="M 935 825 L 1070 825" class="green-edge"/>
  <rect x="942" y="844" width="128" height="46" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="1006" y="864" text-anchor="middle" class="edge-label">dispatch / consume</text>
  <text x="1006" y="882" text-anchor="middle" class="edge-note">kick_cpu</text>

  <text x="750" y="955" text-anchor="middle" class="subtitle">蓝色：用户态控制与加载　　橙色：共享状态读取　　绿色：sched_ext 调度路径</text>
</svg>
